[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm1814-led"
version = "0.1.0"
description = "Control TM1814 / Zengge (Surplife, Magic Home) Wi-Fi LED pixel controllers: web UI, effect catalog, run lists and schedules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "astral>=3.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
tm1814-led = "tm1814_led.cli:main"

[tool.setuptools]
packages = ["tm1814_led", "tm1814_led.effects"]

[tool.setuptools.package-data]
tm1814_led = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
