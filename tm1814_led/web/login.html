<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in - LED Controller</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='8' cy='16' r='5' fill='%23ff5a00'/%3E%3Ccircle cx='24' cy='16' r='5' fill='%232563eb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
    .login { width: 100%; max-width: 380px; }
    .login h1 { margin: 0 0 var(--space-1); font-size: 1.4rem; display: flex; align-items: center; gap: var(--space-2); }
    .login p { color: var(--text-muted); margin: 0 0 var(--space-4); }
    .login label { display: block; font-weight: 600; margin-bottom: var(--space-1); }
    .login input { width: 100%; box-sizing: border-box; }
    .login .row { margin-bottom: var(--space-4); }
    .login button { width: 100%; }
    .login .error { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-4); }
    .login .show { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); font-weight: 400; color: var(--text-muted); }
    .login .show input { width: auto; }
  </style>
</head>
<body>
  <main class="card login">
    <h1><span class="brand-dots" aria-hidden="true"><i style="background:#ff5a00"></i><i style="background:#8c00ff"></i><i style="background:#00b8d9"></i></span> LED Controller</h1>
    <p>Enter the password to continue.</p>
    <form id="form" autocomplete="on">
      <div id="error" class="error" role="alert" hidden></div>
      <div class="row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
        <label class="show"><input id="show" type="checkbox"> Show password</label>
      </div>
      <button class="primary" id="go" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    (function () {
      var form = document.getElementById('form'), pw = document.getElementById('password');
      var err = document.getElementById('error'), go = document.getElementById('go');
      document.getElementById('show').addEventListener('change', function (e) { pw.type = e.target.checked ? 'text' : 'password'; });
      function fail(msg) { err.textContent = msg; err.hidden = false; go.disabled = false; go.textContent = 'Sign in'; pw.focus(); pw.select(); }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.hidden = true; go.disabled = true; go.textContent = 'Signing in...';
        fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
                              body: JSON.stringify({ password: pw.value }) })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) { if (res.ok) { window.location.replace('/'); } else { fail(res.d.detail || 'Could not sign in.'); } })
          .catch(function () { fail('Cannot reach the LED program. Is it running?'); });
      });
    })();
  </script>
</body>
</html>
